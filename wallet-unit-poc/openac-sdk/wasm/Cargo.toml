[package]
name = "openac-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for OpenAC zero-knowledge proving system"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ecdsa-spartan2 = { path = "../../ecdsa-spartan2", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bincode = "1.3.3"
spartan2 = { git = "https://github.com/0xVikasRushi/Spartan2.git", branch = "openac-sdk", default-features = false }
console_error_panic_hook = "0.1"
# Multi-threaded WASM: rayon thread pool backed by Web Workers + SharedArrayBuffer
wasm-bindgen-rayon = "1.2"
rayon = "1.10.0"  # Must match Spartan2's rayon version exactly

[profile.release]
opt-level = 3
lto = true
