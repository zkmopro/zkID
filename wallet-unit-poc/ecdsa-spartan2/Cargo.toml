[package]
name = "ecdsa-spartan2"
version = "0.0.1"
edition = "2021"

[lib]
name = "ecdsa_spartan2"
path = "src/lib.rs"

[[bin]]
name = "ecdsa-spartan2"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = [
  "dep:witnesscalc-adapter",
  "dep:serde_json",
  "dep:sha2",
  "dep:memmap2",
  "dep:num-bigint",
  "dep:base64",
  "dep:x509-cert",
  "dep:rsa",
  "dep:der",
  "dep:const-oid",
  "dep:hex",
  "dep:ureq",
]

[dependencies]
spartan2 = { git = "https://github.com/0xVikasRushi/Spartan2.git", branch = "openac-sdk", default-features = false }
circom-scotia = { git = "https://github.com/0xVikasRushi/circom-scotia", branch = "feat/spartan2", default-features = false }
bellpepper = "0.4.0"
bellpepper-core = "0.4.0"
ff = { version = "0.13.0", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "time"] }
bincode = "1.3.3"

# Native-only dependencies (gated behind "native" feature)
serde_json = { version = "1.0.140", optional = true }
sha2 = { version = "0.10", features = ["oid"], optional = true }
memmap2 = { version = "0.9.8", optional = true }
witnesscalc-adapter = { git = "https://github.com/zkmopro/witnesscalc_adapter.git", branch = "secq256r1-support", optional = true }
num-bigint = { version = "0.4.6", optional = true }
base64 = { version = "0.22", optional = true }
x509-cert = { version = "0.2", optional = true }
rsa = { version = "0.9", optional = true }
der = { version = "0.7", features = ["derive"], optional = true }
const-oid = { version = "0.9", features = ["db"], optional = true }
hex = { version = "0.4.3", optional = true }
ureq = { version = "2", features = ["json"], optional = true }

[build-dependencies]
witnesscalc-adapter = { git = "https://github.com/zkmopro/witnesscalc_adapter.git", branch = "secq256r1-support", optional = true }
chkstk_stub = { version = "0.1.0" }

[profile.release]
debug = true
